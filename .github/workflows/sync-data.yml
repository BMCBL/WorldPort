name: Sync game data

on:
  schedule:
    # Weekly: Chunker extracts a registry per game build, so a new release shows up
    # there long before anyone notices a block is unmapped.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Refresh Chunker registries and bake catalogs
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Sync Chunker data
        run: python3 -I scripts/sync_chunker_data.py
      - name: Rebuild both catalog sets
        run: |
          python3 -I scripts/gen_bedrock_catalogs.py
          python3 -I scripts/gen_je_catalogs_from_chunker.py \
            $(python3 -c "import os; print(' '.join(sorted(os.listdir('_refs/chunker/cli/data/java'))))")
      - name: Refresh the coverage baseline
        run: |
          cargo run -q --release -p worldport-core --example palette_audit -- --json \
            > mappings/coverage_baseline.json
          # The gate is what decides whether a refresh is acceptable: a new
          # version may improve counts, but a regression fails here rather than
          # being committed.
          cargo test --release -p worldport-core --test palette_coverage \
            --test entity_coverage --test bedrock_versions
      - name: Commit when anything changed
        run: |
          # `_refs/` is ignored, so only the generated catalogs and the baseline
          # can appear here; the sync itself is reproducible from the tag in the
          # commit message.
          if git diff --quiet -- mappings; then
            echo "no catalog changes"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mappings
          git commit -m "chore(data): refresh block catalogs from Chunker

          Regenerated by the scheduled sync. The coverage gate ran first, so a
          version that would lose blocks fails the job instead of landing here."
          git push
