[workspace]
resolver = "3"
members = ["core", "cli", "protocol", "native"]
exclude = [
    "plugin",
    "sdk/bmcbl-plugin-api",
    "sdk/bmcbl-plugin-macros",
    "vendor/bedrock-leveldb",
    "vendor/bedrock-nbt",
    "vendor/bedrock-world",
]

[workspace.dependencies]
worldport-core = { path = "core" }
worldport-protocol = { path = "protocol" }
bedrock-nbt = { path = "vendor/bedrock-nbt", version = "0.1.0", default-features = false, features = ["parallel"] }
bedrock-leveldb = { path = "vendor/bedrock-leveldb", version = "0.7.0", default-features = false }
bedrock-world = { path = "vendor/bedrock-world", version = "0.7.0", default-features = false, features = ["bedrock-leveldb", "simd"] }
anyhow = "1.0.100"
thiserror = "2.0.17"
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = "1.0.145"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
bytes = "1.10.1"
rayon = "1.11.0"
flate2 = { version = "1.1.5", default-features = false, features = ["zlib-rs"] }
indexmap = { version = "2.12.1", features = ["serde"] }
rustc-hash = "2.1.1"
tracing = "0.1.43"
clap = { version = "4.5.53", features = ["derive"] }
uuid = { version = "1.19.0", features = ["v4"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false
debug = 0

# 插件原生组件与 CLI 的正式构建配置：体积小、速度高。
[profile.native-release]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false
debug = 0

[profile.dev]
opt-level = 1
debug = "line-tables-only"
