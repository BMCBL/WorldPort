[workspace]
resolver = "3"
members = ["core", "cli", "protocol", "native"]
exclude = [
    "plugin",
    "sdk/bmcbl-plugin-api",
    "sdk/bmcbl-plugin-macros",
    "vendor/bedrock-leveldb",
    "vendor/bedrock-nbt",
    "vendor/bedrock-world",
]

[workspace.dependencies]
worldport-core = { path = "core" }
worldport-protocol = { path = "protocol" }
bedrock-nbt = { path = "vendor/bedrock-nbt", version = "0.1.0", default-features = false, features = ["parallel"] }
bedrock-leveldb = { path = "vendor/bedrock-leveldb", version = "0.7.0", default-features = false }
bedrock-world = { path = "vendor/bedrock-world", version = "0.7.0", default-features = false, features = ["bedrock-leveldb", "simd"] }
anyhow = "1.0.100"
thiserror = "2.0.17"
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = "1.0.145"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
bytes = "1.10.1"
rayon = "1.11.0"
# `runtime_detection` enables `zlib-rs/std`, which is what lets zlib-rs call
# `is_x86_feature_detected!` at all: without `std` every
# `is_enabled_avx2_and_bmi2()` returns false and its AVX2 inflate path is dead
# code. It costs nothing when the backend is not zlib-rs.
#
# Note that `bedrock-leveldb` requests flate2's `zlib-ng` backend on x86_64 and
# aarch64, and flate2 prefers `any_c_zlib` over `zlib-rs`, so the backend that
# actually runs is zlib-ng (which does its own runtime CPU dispatch). The
# zlib-rs features are kept correct for platforms where zlib-ng is not used.
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs", "runtime_detection"] }
indexmap = { version = "2.12.1", features = ["serde"] }
rustc-hash = "2.1.1"
tracing = "0.1.43"
clap = { version = "4.5.53", features = ["derive"] }
uuid = { version = "1.19.0", features = ["v4"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false
debug = 0

# 插件原生组件与 CLI 的正式构建配置：体积小、速度高。
[profile.native-release]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false
debug = 0

[profile.dev]
opt-level = 1
debug = "line-tables-only"
