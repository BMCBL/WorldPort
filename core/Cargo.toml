[package]
name = "worldport-core"
version = "0.0.9"
edition = "2024"
license = "GPL-3.0"
publish = false
description = "WorldPort conversion engine: Minecraft Bedrock <-> Java worlds"
build = "build.rs"

[dependencies]
bedrock-nbt.workspace = true
bedrock-leveldb.workspace = true
bedrock-world.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
postcard.workspace = true
bytes.workspace = true
rayon.workspace = true
flate2.workspace = true
indexmap.workspace = true
rustc-hash.workspace = true
tracing.workspace = true
uuid.workspace = true
lz4_flex = "0.11.5"
cesu8 = "1.1.0"
lz4-java-wrc = "0.2.0"
simd_cesu8 = "1.1.1"
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg"] }

[build-dependencies]
flate2.workspace = true
serde_json.workspace = true
lz4_flex = "0.11.5"

[dev-dependencies]
tempfile = "3.23.0"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
